name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install -r requirements_test.txt

      - name: Compile integration
        run: python -m compileall -q custom_components/heating_controller

      - name: Validate JSON metadata
        run: |
          python -m json.tool custom_components/heating_controller/manifest.json > /dev/null
          python -m json.tool custom_components/heating_controller/strings.json > /dev/null
          python -m json.tool hacs.json > /dev/null

      - name: Run tests
        run: python -m pytest -q tests
